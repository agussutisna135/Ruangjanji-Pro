<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const repo = '/Ruangjanji-Pro';
        const fixUrl = (val) => {
          if (typeof val === 'string' && val.startsWith('/') && !val.startsWith(repo) && !val.startsWith('//')) {
            return repo + val;
          }
          return val;
        };

        const origFetch = window.fetch;
        window.fetch = function(input, init) {
          if (typeof input === 'string') {
            input = fixUrl(input);
          } else if (input instanceof Request) {
            input = new Request(fixUrl(input.url), input);
          }
          return origFetch.call(this, input, init);
        };

        const fixAttr = (el, attr) => {
          const val = el.getAttribute(attr);
          const fixed = fixUrl(val);
          if (fixed !== val) el.setAttribute(attr, fixed);
        };
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((m) => {
            m.addedNodes.forEach((node) => {
              if (node.nodeType === 1) {
                if (node.tagName === 'IMG') fixAttr(node, 'src');
                node.querySelectorAll && node.querySelectorAll('img').forEach(img => fixAttr(img, 'src'));
              }
            });
            if (m.type === 'attributes' && m.target.tagName === 'IMG') {
              fixAttr(m.target, 'src');
            }
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RUANGJANJI PRO — Create Your Beautiful Moments</title>
    <meta
      name="description"
      content="Platform pembuat undangan pernikahan digital premium dengan 100 tema foto asli, editor desain visual, RSVP & buku tamu real-time, amplop digital, dan musik latar."
    />
    <meta property="og:title" content="RUANGJANJI PRO — Create Your Beautiful Moments" />
    <meta
      property="og:description"
      content="Platform pembuat undangan pernikahan digital premium dengan tampilan elegan dan fitur lengkap."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />
